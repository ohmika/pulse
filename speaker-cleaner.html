<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker Cleaner</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #4f46e5; --accent-dark: #4338ca; --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1020; --card: #151b2e; --text: #e8ecf5; --muted: #8b95ad;
            --line: #263050; --accent: #818cf8; --accent-dark: #a5b4fc; --accent-soft: #1e2545; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
         border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .label { font-size: .75rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
           color: var(--muted); margin: 18px 0 8px; }
  .row { display: grid; gap: 8px; }
  .modes { grid-template-columns: repeat(3, 1fr); }
  .speakers { grid-template-columns: repeat(3, 1fr); }
  .opt {
    font: inherit; color: var(--text); background: transparent; cursor: pointer;
    border: 2px solid var(--line); border-radius: 12px; padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .85rem;
  }
  .opt svg { width: 24px; height: 24px; }
  .opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .opt:disabled { opacity: .5; cursor: not-allowed; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }
  .status { display: flex; justify-content: space-between; margin-top: 6px; font-size: .85rem; color: var(--muted); }
  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 20px; }
  .btn { font: inherit; font-weight: 600; border-radius: 12px; padding: 13px; cursor: pointer; border: 2px solid transparent; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .primary { background: var(--accent); color: #fff; }
  .primary:not(:disabled):hover { background: var(--accent-dark); }
  .secondary { background: transparent; color: var(--text); border-color: var(--line); }
  .note { margin: 16px 0 0; font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Speaker Cleaner</h1>
  <p class="sub">Verwijder water en stof uit je telefoonspeaker met geluid.</p>

  <div class="label">Modus</div>
  <div class="row modes" id="modes">
    <button class="opt active" data-mode="water">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      Water
    </button>
    <button class="opt" data-mode="dust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      Stof
    </button>
    <button class="opt" data-mode="vibrate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="20" rx="2"/><path d="M3 8v8M6 5v14M18 5v14M21 8v8"/></svg>
      Trillen
    </button>
  </div>

  <div class="label">Speaker</div>
  <div class="row speakers" id="speakers">
    <button class="opt active" data-pan="0">Beide</button>
    <button class="opt" data-pan="-1">Links</button>
    <button class="opt" data-pan="1">Rechts</button>
  </div>

  <div class="label">Voortgang</div>
  <div class="bar"><div id="fill"></div></div>
  <div class="status"><span id="pct">0%</span><span id="msg">Klaar om te starten</span></div>

  <div class="actions">
    <button class="btn primary" id="start">Start</button>
    <button class="btn secondary" id="stop" disabled>Stop</button>
  </div>
  <p class="note">Zet het volume op maximaal en leg de telefoon met de speaker naar beneden.</p>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const modeBtns = [...document.querySelectorAll("#modes .opt")];
  const spkBtns = [...document.querySelectorAll("#speakers .opt")];
  const startBtn = $("#start"), stopBtn = $("#stop");

  let mode = "water", pan = 0;
  let ctx, osc, gain, timer, running = false, endAt = 0, totalSec = 0, startedAt = 0;

  function select(btns, btn) {
    btns.forEach((b) => b.classList.toggle("active", b === btn));
  }
  modeBtns.forEach((b) => b.onclick = () => { mode = b.dataset.mode; select(modeBtns, b); });
  spkBtns.forEach((b) => b.onclick = () => { pan = +b.dataset.pan; select(spkBtns, b); });

  function setProgress(p, text) {
    $("#fill").style.width = p + "%";
    $("#pct").textContent = Math.round(p) + "%";
    if (text) $("#msg").textContent = text;
  }

  function lock(on) {
    startBtn.disabled = on;
    stopBtn.disabled = !on;
    [...modeBtns, ...spkBtns].forEach((b) => b.disabled = on);
  }

  // Plan het geluid vooruit via Web Audio-automatie. Geeft totale duur (s) terug.
  function schedule(t0) {
    const g = gain.gain, f = osc.frequency;
    g.setValueAtTime(0, t0);

    if (mode === "water") {
      // 165 Hz in pulsen: 1 s aan, 0,3 s uit, 60 s lang
      f.setValueAtTime(165, t0);
      const total = 60;
      for (let t = 0; t < total; t += 1.3) {
        const s = t0 + t, e = Math.min(s + 1, t0 + total);
        g.setValueAtTime(0, s);
        g.linearRampToValueAtTime(1, s + 0.04);
        g.setValueAtTime(1, Math.max(e - 0.04, s + 0.04));
        g.linearRampToValueAtTime(0, e);
      }
      return total;
    }

    if (mode === "dust") {
      // Zes frequenties van 10 s, met korte stilte ertussen
      const freqs = [200, 300, 450, 700, 1000, 1500];
      freqs.forEach((hz, i) => {
        const s = t0 + i * 10, e = s + 9.5;
        f.setValueAtTime(hz, s);
        g.setValueAtTime(0, s);
        g.linearRampToValueAtTime(1, s + 0.1);
        g.setValueAtTime(1, e - 0.1);
        g.linearRampToValueAtTime(0, e);
      });
      return freqs.length * 10;
    }

    // Trillen: 80 Hz bas, 30 s
    f.setValueAtTime(80, t0);
    g.linearRampToValueAtTime(1, t0 + 0.1);
    g.setValueAtTime(1, t0 + 29.9);
    g.linearRampToValueAtTime(0, t0 + 30);
    return 30;
  }

  function currentLabel(elapsed) {
    if (mode === "water") return "Water verwijderen…";
    if (mode === "dust") {
      const hz = [200, 300, 450, 700, 1000, 1500][Math.min(5, Math.floor(elapsed / 10))];
      return "Stof verwijderen… " + hz + " Hz";
    }
    return "vibrate" in navigator ? "Trillen…" : "Diepe bas…";
  }

  function cleanup() {
    clearInterval(timer);
    try { osc && osc.stop(); } catch (_) {}
    osc && osc.disconnect();
    gain && gain.disconnect();
    osc = gain = null;
    if ("vibrate" in navigator) navigator.vibrate(0);
    running = false;
    lock(false);
  }

  async function start() {
    if (running) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") await ctx.resume();
    } catch (_) {
      alert("Deze browser ondersteunt geen Web Audio.");
      return;
    }

    running = true;
    lock(true);

    osc = ctx.createOscillator();
    gain = ctx.createGain();
    const panner = ctx.createStereoPanner();
    panner.pan.value = pan;
    osc.type = "sine";
    osc.connect(gain).connect(panner).connect(ctx.destination);

    const t0 = ctx.currentTime + 0.05;
    totalSec = schedule(t0);
    osc.start(t0);
    osc.stop(t0 + totalSec + 0.1);
    startedAt = t0;

    if (mode === "vibrate" && "vibrate" in navigator) {
      // 30 s lang: 200 ms trillen, 100 ms pauze
      navigator.vibrate(Array(100).fill([200, 100]).flat());
    }

    timer = setInterval(() => {
      const elapsed = Math.max(0, ctx.currentTime - startedAt);
      const p = Math.min(100, (elapsed / totalSec) * 100);
      if (p >= 100) {
        cleanup();
        setProgress(100, "Klaar!");
      } else {
        setProgress(p, currentLabel(elapsed));
      }
    }, 100);
    setProgress(0, "Bezig…");
  }

  function stop() {
    cleanup();
    setProgress(0, "Gestopt");
  }

  startBtn.onclick = start;
  stopBtn.onclick = stop;
  window.addEventListener("pagehide", cleanup);
})();
</script>
</body>
</html>
